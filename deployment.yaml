apiVersion: apps/v1
kind: Deployment

metadata:
  name: restaurant-company
  namespace: restaurant-prod
  labels:
    app: restaurant-company

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: restaurant-company

  template:
    metadata:
      labels:
        app: restaurant-company
        app.kubernetes.io/name: restaurant-company
        app.kubernetes.io/component: frontend

    spec:
      serviceAccountName: restaurant-company

      terminationGracePeriodSeconds: 30

      containers:
        - name: restaurant-company

          image: 107014414047.dkr.ecr.us-east-1.amazonaws.com/restaurant-company:latest

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          envFrom:
            - configMapRef:
                name: restaurant-company-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
