apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-company
  namespace: restaurant-prod
  labels:
    app: restaurant-company
    app.kubernetes.io/name: restaurant-company
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: restaurant-company

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: restaurant-company

  template:
    metadata:
      labels:
        app: restaurant-company
        app.kubernetes.io/name: restaurant-company
        app.kubernetes.io/component: frontend

    spec:
      serviceAccountName: restaurant-company

      terminationGracePeriodSeconds: 30

      containers:
        - name: restaurant-company

          image: 107014414047.dkr.ecr.us-east-1.amazonaws.com/restaurant-company@sha256:5bef0f243210691c34dfe953eb2d747e59977d840d76c856c72ec025460eaf05

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          envFrom:
            - configMapRef:
                name: restaurant-company-config

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
